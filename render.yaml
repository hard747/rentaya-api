# Despliegue en Render (Blueprint). Región Ohio = misma región que la base de Neon (us-east-2).
# Los valores marcados con sync: false se cargan en el panel de Render, nunca en el repositorio.
services:
  - type: web
    name: rentaya-api
    runtime: docker
    region: ohio
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
