spring.application.name=rentaya-api

# Los tests usan H2 en memoria (modo PostgreSQL), nunca la base de Neon.
# Flyway crea el esquema con las mismas migraciones que producción y Hibernate lo valida.
spring.datasource.url=jdbc:h2:mem:rentaya;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Valores solo para tests (no son credenciales reales).
rentaya.jwt.secret=clave-de-pruebas-de-al-menos-32-caracteres
rentaya.jwt.expiracion-minutos=60
rentaya.admin.username=admin
rentaya.admin.password=admin-pruebas-123
