spring.application.name=rentaya-api

# Los tests usan H2 en memoria (modo PostgreSQL), nunca la base de Neon.
spring.datasource.url=jdbc:h2:mem:rentaya;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
