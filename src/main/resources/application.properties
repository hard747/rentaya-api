spring.application.name=rentaya-api

# Perfil por defecto: dev (Neon con credenciales en .env). En producción: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# El esquema lo controla Flyway (src/main/resources/db/migration).
# baseline: la tabla vehiculos ya existía en Neon antes de Flyway, así que V1 se marca como aplicada.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoint.health.show-details=always

# Seguridad: JWT firmado con HMAC-SHA256. El secreto y el admin inicial vienen de variables de entorno.
rentaya.jwt.secret=${JWT_SECRET:}
rentaya.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}
rentaya.admin.username=${ADMIN_USERNAME:}
rentaya.admin.password=${ADMIN_PASSWORD:}

# Orígenes del frontend autorizados por CORS, separados por comas (en Render: CORS_ORIGENES).
rentaya.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
