spring.application.name=rentaya-api

# Perfil por defecto: dev (Neon con credenciales en .env). En producción: SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# El esquema lo controla Flyway (src/main/resources/db/migration).
# baseline: la tabla vehiculos ya existía en Neon antes de Flyway, así que V1 se marca como aplicada.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

management.endpoint.health.show-details=always
