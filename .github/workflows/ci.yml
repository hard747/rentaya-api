name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Tests y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Incluye los tests con Testcontainers: el runner de GitHub tiene Docker.
      - name: Tests (unitarios, integración y PostgreSQL con Testcontainers)
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Construir la imagen Docker
        run: docker build -t rentaya-api .
